name: Release

on:
  push:
    branches: [main]
  # Manual runs re-publish the current released version to the Chrome Web Store and
  # GHCR (built from its release tag) — use after a store rejection or failed image push.
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish packages
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Versions are fixed across packages, and main only carries a new version once the
      # Version Packages PR merges, so this is always the latest released (tagged) version.
      - name: Read released version
        id: version
        if: ${{ !cancelled() }}
        run: echo "version=$(node -p "require('./packages/core/package.json').version")" >> "$GITHUB_OUTPUT"

  chrome:
    name: Publish extension to Chrome Web Store
    needs: release
    # Separate job so a store-side rejection fails only this job. publishedPackages is a
    # JSON string; a substring match avoids fromJSON erroring when it is empty.
    if: >-
      !cancelled() && needs.release.outputs.version != '' &&
      (contains(needs.release.outputs.publishedPackages, '"@crypt.fyi/extension"') ||
      (github.event_name == 'workflow_dispatch' && needs.release.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/@crypt.fyi/extension@${{ needs.release.outputs.version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Explicit rather than .nvmrc: release tags cut before .nvmrc existed (<= 0.0.21)
          # must still build on manual recovery runs. Keep in sync with .nvmrc.
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish extension
        run: pnpm release:extension
        env:
          REQUIRE_CHROME_PUBLISH: '1'
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}

  docker:
    name: Publish server image to GHCR
    needs: release
    # `published` is only true when `changeset publish` emitted new tags. Built from the
    # release tag so a manual run never ships unreleased main under a released version.
    if: >-
      !cancelled() && needs.release.outputs.version != '' &&
      (needs.release.outputs.published == 'true' ||
      (github.event_name == 'workflow_dispatch' && needs.release.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/@crypt.fyi/server@${{ needs.release.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/crypt.fyi-server
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=raw,value=latest

      # Only the server image is published: the web image bakes VITE_API_URL in at build
      # time, so a prebuilt one would point every self-hoster at the same API.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
