services:
  redis:
    image: redis:latest
    # Memory only: dev data is disposable. The image snapshots by default, so
    # persistence has to be turned off explicitly.
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
    ports:
      - '6379:6379'
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - 16686:16686
      - 4318:4318
