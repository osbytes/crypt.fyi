services:
  redis:
    image: redis:latest
    # Bound memory so a flood of secrets can't exhaust the host. Secrets are
    # TTL'd and must never be silently dropped, so use noeviction: once the cap
    # is hit, new writes are rejected (surfacing pressure) rather than evicting
    # live secrets.
    #
    # Only inline secrets live here — a streamed payload costs ~0.4 KB in Redis
    # regardless of its size. Give the container roughly double this value in
    # real memory: RDB snapshots fork, and copy-on-write can approach 2x during
    # the write.
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-4gb}
      - --maxmemory-policy
      - noeviction
      - --save
      - '900'
      - '1'
      - --loglevel
      - warning
    volumes:
      - redis_data:/data

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      - REDIS_URL=redis://redis:6379
      # Without these the server falls back to development mode and the
      # well-known key 'foobar', which encrypts webhook URLs and IP allow-lists
      # at rest. Compose fails fast rather than starting an insecure instance.
      - NODE_ENV=${NODE_ENV:-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY} # ! required - copy .env.example to .env and run openssl rand -base64 32
      - PORT=${SERVER_PORT:-4321}
    ports:
      - '${SERVER_PORT:-4321}:${SERVER_PORT:-4321}'
    depends_on:
      - redis

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - VITE_API_URL=${API_URL:-http://localhost:${SERVER_PORT:-4321}}
        # Password policy. Defaults to optional; set REQUIRE_PASSWORD=true (and
        # optionally PASSWORD_MIN_LENGTH) in .env, then rebuild — these are
        # compiled into the static bundle, so `--build` is required to change them.
        - VITE_REQUIRE_PASSWORD=${REQUIRE_PASSWORD:-false}
        - VITE_PASSWORD_MIN_LENGTH=${PASSWORD_MIN_LENGTH:-5}
    environment:
      - API_URL=${API_URL:-http://localhost:${SERVER_PORT:-4321}}
    ports:
      - '${WEB_PORT:-80}:80'
    depends_on:
      - server

volumes:
  redis_data:
