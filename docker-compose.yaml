services:
  redis:
    image: redis:latest
    # Bound memory so a flood of secrets can't exhaust the host. Secrets are
    # TTL'd and must never be silently dropped, so use noeviction: once the cap
    # is hit, new writes are rejected (surfacing pressure) rather than evicting
    # live secrets. Tune REDIS_MAXMEMORY to the host.
    #
    # Memory only (SPECIFICATION.md 6.2): a snapshot or AOF would keep ciphertext,
    # verification hashes and delete tokens on disk after a burn. A Redis restart
    # therefore drops unexpired secrets and queued webhooks.
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
      - --save
      - ''
      - --appendonly
      - 'no'
      - --loglevel
      - warning

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=${SERVER_PORT:-4321}
      # Encrypts IP restrictions and webhook URLs at rest in Redis.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (e.g. openssl rand -base64 32)}
    ports:
      - '${SERVER_PORT:-4321}:${SERVER_PORT:-4321}'
    depends_on:
      - redis

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      - API_URL=${API_URL:-http://localhost:${SERVER_PORT:-4321}}
    ports:
      - '${WEB_PORT:-80}:80'
    depends_on:
      - server
